name: Build Windows (Felix)

on:
  workflow_dispatch:
  push:
    branches:
      - 'felix/**'
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 3 -and -not $ok; $i++) {
            choco install ninja -y --no-progress
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { Start-Sleep 20 }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            echo "::warning::choco could not install ninja (exit $LASTEXITCODE); using pip"
            python -m pip install ninja
            if ($LASTEXITCODE -ne 0) { echo "::error::ninja install failed"; exit 1 }
          }
          echo "::notice::ninja $(ninja --version)"
          echo "::notice::VCPKG_ROOT=$env:VCPKG_ROOT exists=$(Test-Path $env:VCPKG_ROOT)"
          $ok = $false
          for ($i = 0; $i -lt 3 -and -not $ok; $i++) {
            vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows 2>&1 | Tee-Object -FilePath vcpkg.log
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { Start-Sleep 20 }
          }
          if (-not $ok) {
            $tail = (Get-Content vcpkg.log -Tail 15) -join ' | '
            echo "::error::vcpkg install failed: $tail"
            exit 1
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset x-windows-ci-${{matrix.preset}} 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 20) -join ' | '
            echo "::error::configure failed: $tail"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset x-windows-ci-${{matrix.preset}} 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error C|error LNK|fatal error|: error' | Select-Object -First 12 | ForEach-Object { echo "::error::$($_.Line)" }
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/res/
            build/install/mods/
            build/install/debug.7z
            build/install/sdk/
